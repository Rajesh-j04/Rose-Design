<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="thiraiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1622" />
      <stop offset="50%" stop-color="#172536" />
      <stop offset="100%" stop-color="#171514" />
    </linearGradient>
    <linearGradient id="thiraiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" />
      <stop offset="50%" stop-color="#B08A57" />
      <stop offset="100%" stop-color="#805B27" />
    </linearGradient>
    <linearGradient id="cinemaGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#672D39" />
      <stop offset="60%" stop-color="#A76570" />
      <stop offset="100%" stop-color="#B08A57" />
    </linearGradient>
    <linearGradient id="thiraiCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2636" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111B27" stop-opacity="0.98" />
    </linearGradient>
    <filter id="thiraiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="16" fill="url(#thiraiBg)"/>
  
  <!-- Film Strip & Cinematic Light Cones -->
  <circle cx="700" cy="100" r="180" fill="#672D39" opacity="0.15" filter="blur(60px)"/>
  <circle cx="100" cy="500" r="200" fill="#172536" opacity="0.3" filter="blur(60px)"/>
  <circle cx="400" cy="300" r="280" stroke="url(#thiraiGold)" stroke-width="0.8" stroke-dasharray="8 8" opacity="0.25"/>

  <!-- Device / Mockup Card (Theatrical Cinema Platform) -->
  <g transform="translate(120, 80)" filter="url(#thiraiShadow)">
    <rect width="560" height="380" rx="14" fill="url(#thiraiCard)" stroke="url(#thiraiGold)" stroke-width="1.2"/>
    
    <!-- Top Bar -->
    <rect width="560" height="36" rx="14" fill="#0E1622"/>
    <circle cx="24" cy="18" r="4.5" fill="#A76570"/>
    <circle cx="40" cy="18" r="4.5" fill="#B08A57"/>
    <circle cx="56" cy="18" r="4.5" fill="#183B32"/>
    <rect x="180" y="10" width="200" height="16" rx="8" fill="#1A2433"/>
    <text x="280" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D9B1AE" text-anchor="middle" letter-spacing="1">thiraiflicks.com</text>

    <!-- Main Content Area -->
    <g transform="translate(36, 56)">
      <!-- Left Column: Cinematic Typography -->
      <g transform="translate(0, 8)">
        <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#B08A57" text-transform="uppercase">OCEANIA THEATRICAL DISTRIBUTION</text>
        <text y="36" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="600" fill="#F7F3EC" letter-spacing="0.5">
          Cinema Across <tspan font-style="italic" fill="url(#cinemaGlow)">Borders</tspan>.
        </text>
        <text y="70" font-family="'Cormorant Garamond', serif" font-size="32" font-weight="500" fill="#F7F3EC">Australia, NZ &amp; Pacific.</text>
        
        <text y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D9B1AE" opacity="0.85">
          Distributing blockbuster Indian cinema to major screens.
        </text>
        <text y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D9B1AE" opacity="0.85">
          Hoyts, Event Cinemas &amp; independent arthouse venues.
        </text>

        <!-- Film Tags -->
        <g transform="translate(0, 144)">
          <rect width="70" height="22" rx="11" fill="#672D39" stroke="url(#thiraiGold)" stroke-width="0.6"/>
          <text x="35" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#F7F3EC" text-anchor="middle">TAMIL</text>

          <rect x="78" width="70" height="22" rx="11" fill="#172536" stroke="#B08A57" stroke-width="0.6"/>
          <text x="113" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#F7F3EC" text-anchor="middle">TELUGU</text>

          <rect x="156" width="75" height="22" rx="11" fill="#183B32" stroke="#B08A57" stroke-width="0.6"/>
          <text x="193" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#F7F3EC" text-anchor="middle">MALAYALAM</text>

          <rect x="238" width="60" height="22" rx="11" fill="#2E2421"/>
          <text x="268" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#D9B1AE" text-anchor="middle">HINDI</text>
        </g>

        <!-- Stats Counter -->
        <g transform="translate(0, 185)">
          <rect width="145" height="65" rx="8" fill="#111B27" stroke="#B08A57" stroke-width="0.6"/>
          <text x="14" y="26" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="700" fill="url(#thiraiGold)">120+ Screens</text>
          <text x="14" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D9B1AE">Across AU &amp; New Zealand</text>

          <rect x="155" width="145" height="65" rx="8" fill="#111B27" stroke="#B08A57" stroke-width="0.6"/>
          <text x="169" y="26" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="700" fill="url(#cinemaGlow)">45+ Releases</text>
          <text x="169" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D9B1AE">Theatrical &amp; Premieres</text>
        </g>
      </g>

      <!-- Right Column: Film Poster Graphic & Reel Motif -->
      <g transform="translate(350, 15)">
        <!-- Poster Frame -->
        <rect width="140" height="200" rx="10" fill="#0E1622" stroke="url(#thiraiGold)" stroke-width="1.5"/>
        
        <!-- Film Reel Emblem -->
        <circle cx="70" cy="70" r="42" fill="#172536" stroke="url(#cinemaGlow)" stroke-width="2"/>
        <circle cx="70" cy="70" r="16" fill="#0E1622" stroke="url(#thiraiGold)" stroke-width="1.5"/>
        <circle cx="70" cy="46" r="4" fill="#F7F3EC"/>
        <circle cx="94" cy="70" r="4" fill="#F7F3EC"/>
        <circle cx="70" cy="94" r="4" fill="#F7F3EC"/>
        <circle cx="46" cy="70" r="4" fill="#F7F3EC"/>

        <text x="70" y="135" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="700" fill="#F7F3EC" text-anchor="middle" letter-spacing="1">THIRAI FLICKS</text>
        <text x="70" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#D9B1AE" text-anchor="middle" letter-spacing="2">DISTRIBUTION</text>
        <rect x="25" y="165" width="90" height="22" rx="11" fill="url(#thiraiGold)"/>
        <text x="70" y="179" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#171514" text-anchor="middle">SHOWTIMES</text>
      </g>
    </g>
  </g>

  <!-- Bottom Project Label -->
  <g transform="translate(120, 500)">
    <rect width="560" height="60" rx="10" fill="#171514" stroke="#B08A57" stroke-width="0.8" opacity="0.95"/>
    <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#B08A57" text-transform="uppercase">ENTERTAINMENT &amp; CINEMA BRANDING</text>
    <text x="24" y="46" font-family="'Cormorant Garamond', serif" font-size="18" font-weight="600" fill="#F7F3EC">Thirai Flicks — Theatrical Distribution Identity &amp; Digital Campaign Engine</text>
    <text x="536" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#D9B1AE" text-anchor="end">Australia &amp; New Zealand →</text>
  </g>
</svg>