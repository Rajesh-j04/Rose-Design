<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="refBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#172536" />
      <stop offset="100%" stop-color="#171514" />
    </linearGradient>
    <linearGradient id="refGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" />
      <stop offset="50%" stop-color="#B08A57" />
      <stop offset="100%" stop-color="#805B27" />
    </linearGradient>
    <linearGradient id="refRose" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#672D39" />
      <stop offset="60%" stop-color="#A76570" />
      <stop offset="100%" stop-color="#D9B1AE" />
    </linearGradient>
    <linearGradient id="refCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2230" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#121822" stop-opacity="0.98" />
    </linearGradient>
    <filter id="refShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="16" fill="url(#refBg)"/>
  
  <!-- Atmospheric Glow & Subtle Reflected Waves -->
  <circle cx="680" cy="140" r="190" fill="#672D39" opacity="0.2" filter="blur(60px)"/>
  <circle cx="150" cy="480" r="180" fill="#172536" opacity="0.3" filter="blur(50px)"/>
  <circle cx="400" cy="300" r="270" stroke="url(#refGold)" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.25"/>

  <!-- Device / Mockup Card (Editorial Documentary Platform) -->
  <g transform="translate(120, 80)" filter="url(#refShadow)">
    <rect width="560" height="380" rx="14" fill="url(#refCard)" stroke="url(#refGold)" stroke-width="1.2"/>
    
    <!-- Top Bar -->
    <rect width="560" height="36" rx="14" fill="#0F151E"/>
    <circle cx="24" cy="18" r="4.5" fill="#A76570"/>
    <circle cx="40" cy="18" r="4.5" fill="#B08A57"/>
    <circle cx="56" cy="18" r="4.5" fill="#183B32"/>
    <rect x="180" y="10" width="200" height="16" rx="8" fill="#192230"/>
    <text x="280" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D9B1AE" text-anchor="middle" letter-spacing="1">rosedsigns.com/reflections</text>

    <!-- Main Content Area -->
    <g transform="translate(36, 56)">
      <!-- Left Column: Editorial Typography -->
      <g transform="translate(0, 8)">
        <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#B08A57" text-transform="uppercase">ON THE HORIZON · COMING SOON</text>
        <text y="36" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="600" fill="#F7F3EC" letter-spacing="0.5">
          Reflections. <tspan font-style="italic" fill="url(#refRose)">The</tspan>
        </text>
        <text y="70" font-family="'Cormorant Garamond', serif" font-size="32" font-weight="500" fill="#F7F3EC">Resilience of Lives.</text>
        
        <text y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D9B1AE" opacity="0.85">
          "The resilience of extraordinary lives."
        </text>
        <text y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D9B1AE" opacity="0.85">
          A deeply human documentary narrative and digital monograph.
        </text>

        <!-- Project Badges -->
        <g transform="translate(0, 144)">
          <rect width="105" height="22" rx="11" fill="#672D39" stroke="url(#refGold)" stroke-width="0.6"/>
          <text x="52" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#F7F3EC" text-anchor="middle">COMING SOON</text>

          <rect x="113" width="95" height="22" rx="11" fill="#172536" stroke="#B08A57" stroke-width="0.6"/>
          <text x="160" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#D9B1AE" text-anchor="middle">STORYTELLING</text>

          <rect x="216" width="95" height="22" rx="11" fill="#183B32" stroke="#B08A57" stroke-width="0.6"/>
          <text x="263" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#D9B1AE" text-anchor="middle">MONOGRAPH</text>
        </g>

        <!-- Preview Info Box -->
        <g transform="translate(0, 185)">
          <rect width="310" height="65" rx="8" fill="#121822" stroke="#B08A57" stroke-width="0.6"/>
          <text x="14" y="24" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" fill="url(#refGold)">Production Status: In Development</text>
          <text x="14" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#D9B1AE">Editorial direction, visual identity &amp; interactive web experience</text>
        </g>
      </g>

      <!-- Right Column: Abstract Lens & Reflection Motif -->
      <g transform="translate(360, 20)">
        <circle cx="70" cy="70" r="54" fill="#172536" stroke="url(#refGold)" stroke-width="1.5"/>
        <circle cx="70" cy="70" r="42" fill="#0F151E" stroke="url(#refRose)" stroke-width="1" stroke-dasharray="2 3"/>
        <circle cx="70" cy="70" r="28" fill="#141824"/>
        
        <!-- Ripple wave reflection lines -->
        <path d="M 40 70 Q 70 55, 100 70 Q 70 85, 40 70 Z" fill="url(#refGold)" opacity="0.6"/>
        <line x1="25" y1="140" x2="115" y2="140" stroke="#B08A57" stroke-width="0.8"/>
        <text x="70" y="160" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="600" fill="#F7F3EC" text-anchor="middle">REFLECTIONS</text>
        <text x="70" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#D9B1AE" text-anchor="middle">IN PRODUCTION</text>
      </g>
    </g>
  </g>

  <!-- Bottom Project Label -->
  <g transform="translate(120, 500)">
    <rect width="560" height="60" rx="10" fill="#171514" stroke="#B08A57" stroke-width="0.8" opacity="0.95"/>
    <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#B08A57" text-transform="uppercase">ON THE HORIZON · COMING SOON</text>
    <text x="24" y="46" font-family="'Cormorant Garamond', serif" font-size="18" font-weight="600" fill="#F7F3EC">Reflections — The Resilience of Extraordinary Lives</text>
    <text x="536" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D9B1AE" text-anchor="end">Coming Soon →</text>
  </g>
</svg>