<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="palBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14211A" />
      <stop offset="50%" stop-color="#183B32" />
      <stop offset="100%" stop-color="#171514" />
    </linearGradient>
    <linearGradient id="palGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" />
      <stop offset="50%" stop-color="#B08A57" />
      <stop offset="100%" stop-color="#805B27" />
    </linearGradient>
    <linearGradient id="palCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192A22" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#101C16" stop-opacity="0.98" />
    </linearGradient>
    <filter id="palShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="16" fill="url(#palBg)"/>
  
  <!-- Subtle Botanical Accents -->
  <circle cx="680" cy="140" r="180" fill="#183B32" opacity="0.3" filter="blur(60px)"/>
  <circle cx="150" cy="480" r="180" fill="#B08A57" opacity="0.1" filter="blur(50px)"/>
  <circle cx="400" cy="300" r="270" stroke="url(#palGold)" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.25"/>

  <!-- Device / Mockup Card (Heritage Culinary & Spice Packaging) -->
  <g transform="translate(120, 80)" filter="url(#palShadow)">
    <rect width="560" height="380" rx="14" fill="url(#palCard)" stroke="url(#palGold)" stroke-width="1.2"/>
    
    <!-- Top Bar -->
    <rect width="560" height="36" rx="14" fill="#0F1B15"/>
    <circle cx="24" cy="18" r="4.5" fill="#A76570"/>
    <circle cx="40" cy="18" r="4.5" fill="#B08A57"/>
    <circle cx="56" cy="18" r="4.5" fill="#183B32"/>
    <rect x="180" y="10" width="200" height="16" rx="8" fill="#1B2E24"/>
    <text x="280" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D9B1AE" text-anchor="middle" letter-spacing="1">rosedsigns.com/palayam-peppers</text>

    <!-- Main Content Area -->
    <g transform="translate(36, 56)">
      <!-- Left Column: Branding Typography -->
      <g transform="translate(0, 8)">
        <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#B08A57" text-transform="uppercase">ON THE HORIZON · COMING SOON</text>
        <text y="36" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="600" fill="#F7F3EC" letter-spacing="0.5">
          Palayam Peppers.
        </text>
        <text y="70" font-family="'Cormorant Garamond', serif" font-size="32" font-weight="500" fill="#F7F3EC">A New Story.</text>
        
        <text y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D9B1AE" opacity="0.85">
          "A new story."
        </text>
        <text y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D9B1AE" opacity="0.85">
          Heritage Indian spices reimagined with artisanal purity &amp; bespoke packaging.
        </text>

        <!-- Project Badges -->
        <g transform="translate(0, 144)">
          <rect width="105" height="22" rx="11" fill="#672D39" stroke="url(#palGold)" stroke-width="0.6"/>
          <text x="52" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#F7F3EC" text-anchor="middle">COMING SOON</text>

          <rect x="113" width="95" height="22" rx="11" fill="#183B32" stroke="#B08A57" stroke-width="0.6"/>
          <text x="160" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#F7F3EC" text-anchor="middle">HERITAGE SPICE</text>

          <rect x="216" width="95" height="22" rx="11" fill="#171514" stroke="#B08A57" stroke-width="0.6"/>
          <text x="263" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#D9B1AE" text-anchor="middle">PACKAGING</text>
        </g>

        <!-- Preview Info Box -->
        <g transform="translate(0, 185)">
          <rect width="310" height="65" rx="8" fill="#101C16" stroke="#B08A57" stroke-width="0.6"/>
          <text x="14" y="24" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" fill="url(#palGold)">Brand Identity &amp; Packaging Suite</text>
          <text x="14" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#D9B1AE">Tactile spice canisters, custom emblems &amp; digital culinary store</text>
        </g>
      </g>

      <!-- Right Column: Spice Monogram Emblem -->
      <g transform="translate(360, 20)">
        <circle cx="70" cy="70" r="54" fill="#183B32" stroke="url(#palGold)" stroke-width="1.5"/>
        <circle cx="70" cy="70" r="42" fill="#0F1B15" stroke="url(#palGold)" stroke-width="0.8" stroke-dasharray="2 3"/>
        
        <!-- Pepper vine / botanical motif -->
        <path d="M 70 42 C 55 55, 55 85, 70 98 C 85 85, 85 55, 70 42 Z" fill="#672D39" opacity="0.8"/>
        <circle cx="70" cy="70" r="10" fill="url(#palGold)"/>
        
        <line x1="25" y1="140" x2="115" y2="140" stroke="#B08A57" stroke-width="0.8"/>
        <text x="70" y="160" font-family="'Cormorant Garamond', serif" font-size="13" font-weight="600" fill="#F7F3EC" text-anchor="middle">PALAYAM PEPPERS</text>
        <text x="70" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#D9B1AE" text-anchor="middle">IN DEVELOPMENT</text>
      </g>
    </g>
  </g>

  <!-- Bottom Project Label -->
  <g transform="translate(120, 500)">
    <rect width="560" height="60" rx="10" fill="#171514" stroke="#B08A57" stroke-width="0.8" opacity="0.95"/>
    <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#B08A57" text-transform="uppercase">ON THE HORIZON · COMING SOON</text>
    <text x="24" y="46" font-family="'Cormorant Garamond', serif" font-size="18" font-weight="600" fill="#F7F3EC">Palayam Peppers — A New Story</text>
    <text x="536" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D9B1AE" text-anchor="end">Coming Soon →</text>
  </g>
</svg>