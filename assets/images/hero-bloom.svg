<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none">
  <defs>
    <radialGradient id="heroDarkBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#211B1A" />
      <stop offset="50%" stop-color="#171514" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </radialGradient>
    <radialGradient id="bloomGlow" cx="55%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#672D39" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#A76570" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#183B32" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#171514" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldStem" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6734" />
      <stop offset="50%" stop-color="#B08A57" />
      <stop offset="100%" stop-color="#E5D3AE" />
    </linearGradient>
    <linearGradient id="petal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9B1AE" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#A76570" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#672D39" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="petal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EC" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#D9B1AE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#672D39" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="petal3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#183B32" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#172536" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A76570" stop-opacity="0.3" />
    </linearGradient>
    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="900" fill="url(#heroDarkBg)"/>

  <!-- Atmospheric Glow Orbs -->
  <circle cx="650" cy="420" r="380" fill="url(#bloomGlow)"/>
  <circle cx="350" cy="600" r="280" fill="#183B32" opacity="0.2" filter="url(#subtleBlur)"/>
  <circle cx="850" cy="300" r="220" fill="#672D39" opacity="0.3" filter="url(#subtleBlur)"/>
  <circle cx="600" cy="450" r="180" fill="#B08A57" opacity="0.15" filter="url(#subtleBlur)"/>

  <!-- Editorial Geometric Elements -->
  <g opacity="0.35">
    <circle cx="600" cy="450" r="320" stroke="url(#goldStem)" stroke-width="0.75" stroke-dasharray="3 6"/>
    <circle cx="600" cy="450" r="240" stroke="#F7F3EC" stroke-width="0.5"/>
    <circle cx="600" cy="450" r="160" stroke="url(#goldStem)" stroke-width="0.75"/>
    <line x1="150" y1="450" x2="1050" y2="450" stroke="#F7F3EC" stroke-width="0.3" opacity="0.5"/>
    <line x1="600" y1="100" x2="600" y2="800" stroke="#F7F3EC" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- The Blooming Rose & Abstract Botanical Forms -->
  <g transform="translate(600, 460)">
    <!-- Deep Layered Leaves (British Green & Navy) -->
    <path d="M 0 0 C -120 180, -280 140, -320 280 C -340 180, -260 60, -180 20 Z" fill="url(#petal3)" opacity="0.75"/>
    <path d="M 0 0 C 150 160, 290 120, 340 250 C 350 150, 260 50, 160 10 Z" fill="url(#petal3)" opacity="0.6"/>

    <!-- Botanical Stem Lines in Gold -->
    <path d="M 0 320 C -20 220, 10 120, 0 0" stroke="url(#goldStem)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -15 160 C -80 180, -140 140, -190 190" stroke="url(#goldStem)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 10 110 C 70 120, 130 90, 180 130" stroke="url(#goldStem)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- Outer Petals (Burgundy & Antique Rose) -->
    <path d="M 0 -180 C -160 -160, -220 -40, -180 90 C -140 180, -30 180, 0 110 C 30 180, 140 180, 180 90 C 220 -40, 160 -160, 0 -180 Z" 
          fill="url(#petal1)" stroke="url(#goldStem)" stroke-width="1" opacity="0.8"/>
    
    <!-- Mid Blooming Petals (Dusty Blush & Ivory) -->
    <path d="M -90 -110 C -150 -30, -120 80, -40 100 C -10 10, -30 -60, -90 -110 Z" fill="url(#petal2)" opacity="0.85"/>
    <path d="M 90 -110 C 150 -30, 120 80, 40 100 C 10 10, 30 -60, 90 -110 Z" fill="url(#petal2)" opacity="0.85"/>
    <path d="M 0 -140 C -80 -90, -80 30, 0 80 C 80 30, 80 -90, 0 -140 Z" fill="url(#petal1)" opacity="0.9"/>

    <!-- Sculptural Center Rose Bud (The Core) -->
    <ellipse cx="0" cy="-20" rx="42" ry="54" fill="#672D39" stroke="url(#goldStem)" stroke-width="1.5"/>
    <path d="M -15 -40 C 20 -50, 35 -30, 25 -5 C 18 12, -10 15, -20 -2 C -28 -18, -5 -32, 10 -25" 
          stroke="url(#goldStem)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -5 -10 C 12 -16, 18 -5, 10 4 C 4 10, -6 6, -5 -4" 
          stroke="#F7F3EC" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Floating Pollen / Light Sparks -->
    <circle cx="-130" cy="-140" r="3" fill="#B08A57" opacity="0.8"/>
    <circle cx="160" cy="-110" r="2" fill="#E5D3AE" opacity="0.9"/>
    <circle cx="-80" cy="160" r="2.5" fill="#D9B1AE" opacity="0.7"/>
    <circle cx="120" cy="140" r="2" fill="#B08A57" opacity="0.8"/>
    <circle cx="210" cy="-30" r="3" fill="#F7F3EC" opacity="0.7"/>
    <circle cx="-200" cy="20" r="2" fill="#B08A57" opacity="0.6"/>
  </g>

  <!-- Editorial Corner Watermarks & Metadata -->
  <g transform="translate(60, 840)" opacity="0.6">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#D9B1AE" text-transform="uppercase">
      ROSEDSIGNS / CREATIVE STUDIO
    </text>
    <text x="0" y="20" font-family="'Playfair Display', serif" font-size="14" font-style="italic" fill="#F7F3EC">
      "Ideas that make your brand bloom."
    </text>
  </g>

  <g transform="translate(1000, 840)" opacity="0.5">
    <text text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#B08A57">
      EST. 2024 — CHENNAI &amp; PERTH
    </text>
    <text x="0" y="20" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="1" fill="#F7F3EC">
      DISCOVER · CREATE · CONNECT
    </text>
  </g>
</svg>
