<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBB284" />
      <stop offset="50%" stop-color="#B08A57" />
      <stop offset="100%" stop-color="#7C5925" />
    </linearGradient>
    <linearGradient id="roseGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#672D39" />
      <stop offset="60%" stop-color="#A76570" />
      <stop offset="100%" stop-color="#8E4654" />
    </linearGradient>
  </defs>

  <!-- Monogram Emblem (D + Blooming Rose) -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" stroke="url(#goldGradDark)" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>
    <circle cx="40" cy="40" r="35" stroke="url(#goldGradDark)" stroke-width="0.8" opacity="0.9"/>
    
    <path d="M 28 20 L 28 60 M 24 20 L 32 20 M 24 60 L 32 60" stroke="url(#goldGradDark)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 28 20 C 46 19, 58 29, 58 40 C 58 51, 46 61, 28 60" stroke="url(#goldGradDark)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    
    <path d="M 40 38 C 40 34, 45 33, 46 36 C 47 40, 41 43, 38 41 C 34 39, 36 33, 42 32 C 48 31, 51 38, 48 43" 
          stroke="url(#roseGradDark)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 35 44 C 38 49, 46 48, 49 44 C 52 40, 52 35, 48 33" stroke="url(#goldGradDark)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 33 35 C 33 30, 39 26, 44 27" stroke="url(#goldGradDark)" stroke-width="1.2" fill="none" opacity="0.75"/>
    <path d="M 44 47 C 41 51, 35 50, 32 46" stroke="url(#roseGradDark)" stroke-width="1.2" fill="none" opacity="0.85"/>
    
    <path d="M 28 32 C 22 30, 20 25, 23 21 C 25 24, 28 27, 28 32 Z" fill="url(#goldGradDark)" opacity="0.8"/>
  </g>

  <!-- Typography: RoseDsigns (Dark text for light bg) -->
  <g transform="translate(105, 52)">
    <text font-family="'Playfair Display', 'Cormorant Garamond', 'Didot', Georgia, serif" font-size="32" font-weight="600" letter-spacing="1.5" fill="#171514">
      Rose<tspan fill="url(#goldGradDark)" font-style="italic" font-weight="400">D</tspan>signs
    </text>
    
    <text y="22" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="4" fill="#672D39" text-transform="uppercase" opacity="0.85">
      Creative &amp; Digital Studio
    </text>
  </g>
</svg>
